{% extends "base.html" %}

{% block content %}
  <h2>Панель администратора: Категории</h2>
  <p><a href="{% url 'admin_requests' %}">Вернуться к запросам</a></p>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Создать категорию</button>
  </form>

  <ul>
    {% for cat in categories %}
      <li>
        {{ cat.name }} —
        <a href="{% url 'admin_category_delete' cat.pk %}" style="color: red;">Delete</a>
      </li>
    {% empty %}
      <li>Пока категорий нет.</li>
    {% endfor %}
  </ul>
{% endblock %}
