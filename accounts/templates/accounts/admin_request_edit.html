{% extends "base.html" %}

{% block content %}
  <h2>Edit Request: {{ object.title }}</h2>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
    <a href="{% url 'admin_requests' %}">Cancel</a>
  </form>
{% endblock %}
