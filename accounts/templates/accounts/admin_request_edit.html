{% extends "base.html" %}

{% block content %}
  <h2>Запрос на редактирование: {{ object.title }}</h2>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Сохранить</button>
    <a href="{% url 'admin_requests' %}">Отменить</a>
  </form>
{% endblock %}
