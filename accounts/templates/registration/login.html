{% extends "base.html" %}

    {% block content %}
      <h2>Login to the personal account</h2>
      {% if form.errors %}
        <p style="color: red;">Incorrect login or password</p>
      {% endif %}
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Войти</button>
      </form>
    {% endblock %}
