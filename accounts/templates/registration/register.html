{% extends "base.html" %}
    {% block content %}
      <h2>Регистрация нового гостя</h2>
      <form method="post" novalidate>
        {% csrf_token %}
        {% for field in form %}
          <div class="{% if field.errors %}field-error{% endif %}" style="margin-bottom: 12px;">
              <label>{{ field.label }};</label><br>
            {{ field }}
            {% if field.errors %}
                <div class="error-text">
                    {{ field.errors|striptags }}
                </div>
            {% endif %}
          </div>
          {% endfor %}

        <button type="submit">Зарегистрироваться</button>
      </form>
    {% endblock %}
